<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>彩色描邊文字</title>
    <style>
        h1 {
            color: #0000; /* 讓文字本體變透明 */
            margin: 0;
            font-size: 80px;
            font-family: impact, arial-black;
            paint-order: stroke;
        }

        h1:nth-child(1) {
            -webkit-text-stroke: 2px red;
        }

        h1:nth-child(2) {
            -webkit-text-stroke: 3px yellowgreen;
        }

        h1:nth-child(3) {
            -webkit-text-stroke: 5px orange;
        }
    </style>
</head>
<body>

    <h1>APPLE</h1>
    <h1>BANANA</h1>
    <h1>ORANGE</h1>

</body>
</html>
